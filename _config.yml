# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

title: Coline Mouze
description: Personal website
baseurl: "/bay"
url: "https://eliottvincent.github.io"
og_image: /home/am/Documents_Coline/Master/RefresherCS/Lab2/ColineMouze.github.io/logo.pdf
%/assets/img/profile-pic.jpg
google_analytics: "UA-121636368-3"

header:
  pages:
    - name: Home
      slug: /
    - name: Work
    - name: Blog

footer:
  show_powered_by: true
  contact:
    - type: email
      name: Email
      value: coline.mouze@gmail.com
    - type: wechat
      value: Cmouze
      link: "#"
  follow:
    - type: twitter
      name: Twitter
      link: http://twitter.com/ColineMouze
      username: "@YourTwitterUsername"
    - type: facebook
      name: Facebook
      link: http://facebook.com/ColineMouze
    - type: linkedin
      name: LinkedIn
      link: http://linkedin.com/in/ColineMouze
    - type: github
      name: GitHub
      link: http://github.com/ColineMouze
    - type: dribbble
      name: Dribbble
      link: https://dribbble.com/ColineMouze
    - type: rss
      name: RSS
      link: /feed.xml

# Build settings
markdown: kramdown
sass:
    style: :compressed
plugins:
  - jekyll-feed

# Excluded items
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - feed.xml
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Used for defeating caching
version: 1
